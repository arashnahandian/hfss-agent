[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hfss-agent"
# Surfaced as ``wrapper_version`` on every stamped record. MOVES INDEPENDENTLY of
# CONTRACT_VERSION (ADR-21 dec. 10) — 0.5.0 beside snapshot-4.0.0 is correct, not
# drift. Minor, because under 0.x the minor IS the breaking increment, and Step
# 2.6a is breaking for a tool-surface consumer three ways over: the fourth
# compute_metrics arm, the target_frequency -> target_frequency_hz rename, and
# the retype of Finding.provenance. Same rule as the 0.2.0 -> 0.3.0 and
# 0.3.0 -> 0.4.0 bumps; see contract/common.py for the full arithmetic.
version = "0.5.0"
description = "Open capability wrapper for a verification-first MCP agent for Ansys HFSS (read-only, attach-only, zero-egress)."
readme = "README.md"
# Python pin held deliberately at 3.10-3.12 per ADR-13 (not PyAEDT's wider
# wheel-viable range). Encoded here at the packaging level, not just in docs.
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Arash Nahandian" }]
keywords = ["hfss", "aedt", "ansys", "mcp", "pyaedt", "rf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Runtime dependencies are added deliberately in later build steps
# (Step 0.2 onward), not at scaffold time.
dependencies = [
    "pydantic>=2",
    # The MCP surface (W-1, Step 2.8). CORE, not an extra: the MCP server is
    # what this package IS, and the tier-completeness test cannot exist in CI
    # behind an optional import. Floor at 2.0.0 because that is the release
    # measured against; ceiling at <3 because this SDK renamed its primary
    # server class across its last major (FastMCP -> MCPServer), so a major
    # bump is a migration event, not a routine upgrade.
    "mcp>=2.0.0,<3",
]

[project.scripts]
# The command an MCP client config names to spawn this server. Without it a
# client must hardcode an absolute interpreter path plus -m, which is fragile
# on Windows and unshareable between machines. ``python -m hfss_agent.server``
# stays available via server/__main__.py for debugging.
hfss-agent = "hfss_agent.server.__main__:main"

[project.optional-dependencies]
# Live AEDT backend for the real adapter (Step 1.2). Declared as an OPTIONAL
# extra, NOT a core dependency: CI runs `uv sync` WITHOUT this extra on both OS
# legs, so the Linux leg never pulls PyAEDT's Windows-only subtree and the whole
# suite runs PyAEDT-free against the FakeAdapter. Ships on PyPI as `pyaedt`;
# imports as `ansys.aedt.core` (the 1.0 restructure). Pinned to 1.2.* per the
# approved plan / ADR. Install locally with: uv sync --extra live
live = ["pyaedt==1.2.*"]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/hfss_agent"]

[tool.ruff]
# Lowest supported interpreter; keeps lint honest against the whole pin range.
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
